[project]
name = "ioanaf-ai-agents-teme"
version = "0.1.0"
description = "Teme pentru cursul de AI Agents"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.0.0",
    "openai>=3.29.0",
    "pypdf>=5.0.0",
    "pydantic[email]>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
